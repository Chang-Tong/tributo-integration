[project]
name = "tributo-knova"
version = "0.3.0"
description = "KnoVa integration for Tributo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ray-clickhouse==1.0",
    "tributo @ git+https://github.com/Chang-Tong/Tributo.git@1eaae848ef7f6acbd600c87771f91f9291f00b3e",
    "tributo-algorithms-boosting @ git+https://github.com/Chang-Tong/tributo-algorithms.git@6f39378d4d850cfd41e9510abc313efc6d4f209f#subdirectory=packages/boosting",
    "tributo-broker-redis[aimodel-v2]>=0.3,<0.4",
]

[project.entry-points."tributo.brokers"]
tributo-knova = "tributo_knova.broker:KnovaBrokerPlugin"

[project.scripts]
tributo-knova = "tributo_knova.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_knova"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = [
    "tributo[model-export] @ git+https://github.com/Chang-Tong/Tributo.git@1eaae848ef7f6acbd600c87771f91f9291f00b3e",
]

[tool.uv.sources]
tributo-broker-redis = { path = "vendor/wheels/tributo_broker_redis-0.3.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
